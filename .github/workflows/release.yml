# Gera os pacotes do app Electron numa maquina limpa, para x64 e arm64.
#
# Tag vX.Y.Z: confere a versao, gera AppImage, deb e tar.gz nas duas
# arquiteturas (cada uma num runner nativo), junta tudo, atesta a procedencia e
# cria a release como RASCUNHO. Publicar e passo humano: o app avisa todo mundo
# da ultima release publicada em ate um dia.
#
# Disparo manual: mesmo build, pacotes so como artefato, sem release.
#
# Acoes fixadas por SHA de commit (tag de acao pode ser movida). A versao fica no
# comentario, para quem for atualizar.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pacotes:
    strategy:
      # Uma arquitetura falhando nao cancela a outra: o diagnostico sai completo.
      # A release depende das duas de qualquer jeito.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            file: x86-64
          - runner: ubuntu-24.04-arm
            arch: arm64
            file: ARM aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Tag bate com a versao do package.json
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          versao="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$versao" ]; then
            echo "::error::tag $TAG diferente da versao do package.json ($versao)"
            exit 1
          fi

      - name: Dependencias exatas do package-lock.json
        run: |
          npm ci
          # O npm 11 bloqueia o postinstall do Electron; rodar de novo e inofensivo.
          node node_modules/electron/install.js

      # O fpm que o electron-builder baixa traz um Ruby x86 e nao roda no runner
      # ARM (medido em 30/09/2026, run 36722531457). No arm64 usa o fpm do
      # sistema, com o .gem conferido pelo SHA-256 publicado no RubyGems.
      - name: fpm do sistema no arm64
        if: matrix.arch == 'arm64'
        run: |
          command -v gem >/dev/null || { sudo apt-get update && sudo apt-get install -y ruby ruby-dev build-essential; }
          curl -fsSLo /tmp/fpm.gem https://rubygems.org/downloads/fpm-1.18.0.gem
          echo "6c6645d51e0cc687faab35441ac6ef1c6ed9b333615ac47f568dd5f9fd46a185  /tmp/fpm.gem" | sha256sum -c
          sudo gem install --no-document /tmp/fpm.gem
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
          fpm --version

      - name: Gerar AppImage, deb e tar.gz
        # --publish never: o electron-builder nunca mexe em release; quem cria o
        # rascunho e o job release.
        run: npm run dist -- --publish never

      # Sem isto, um erro de configuracao publicaria binario x64 com nome de arm64.
      - name: Binario e da arquitetura certa
        env:
          ESPERADO: ${{ matrix.file }}
        run: |
          # Padrao vazio casaria com qualquer binario.
          [ -n "$ESPERADO" ] || { echo "::error::arquitetura esperada vazia"; exit 1; }
          info="$(file dist/linux*-unpacked/whatsapp-linux)"
          echo "$info"
          case "$info" in
            *"$ESPERADO"*) ;;
            *) echo "::error::esperava $ESPERADO"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pacotes-${{ matrix.arch }}
          path: |
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/*.tar.gz
          if-no-files-found: error

  # So na tag. Unico job com permissao de escrita e de assinatura, e um
  # SHA256SUMS.txt so para as duas arquiteturas.
  release:
    if: github.event_name == 'push'
    needs: pacotes
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # criar a release em rascunho
      id-token: write      # assinar a atestacao
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pacotes-*
          path: pacotes
          merge-multiple: true

      - name: Checksums
        working-directory: pacotes
        run: |
          sha256sum *.AppImage *.deb *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            pacotes/*.AppImage
            pacotes/*.deb
            pacotes/*.tar.gz

      - name: Release em rascunho
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Notas escritas a mao, se existirem; senao o GitHub gera pelos commits.
          if [ -f "electron/notas/$TAG.md" ]; then
            notas=(--notes-file "electron/notas/$TAG.md")
          else
            notas=(--generate-notes)
          fi
          gh release create "$TAG" --draft --title "$TAG" "${notas[@]}" \
            pacotes/*.AppImage pacotes/*.deb pacotes/*.tar.gz pacotes/SHA256SUMS.txt
